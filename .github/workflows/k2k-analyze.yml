# Fast Dart check for K2K UI work: generate the bridge, then run the analyzer.
name: K2K analyze

on:
  workflow_dispatch:
  push:
    branches:
      - "k2k-ui*"

concurrency:
  group: k2k-analyze-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  analyze:
    needs: [generate-bridge]
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: bridge-artifact
          path: ./

      - name: Install flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225 # v2.12.0
        with:
          channel: "stable"
          flutter-version: "3.24.5"

      - name: Analyze
        shell: bash
        run: |
          cd flutter
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings lib 2>&1 | tee analyze.log || true
          if grep -E "^\s*error " analyze.log; then
            echo "Dart errors found"
            exit 1
          fi
